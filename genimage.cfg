# Layout GPT do SD para RK3066 (conforme a doc do U-Boot para o MK808).
# O U-Boot completo (u-boot-dtb.img) fica no setor 16384 (8 MiB) = particao loader2.
# A ROM do RK3066 nao le o SD: quem chama este U-Boot e o carregador gravado na NAND.
image boot.vfat {
	vfat {
		files = {
			"zImage",
			"rk3066a-mk808.dtb",
			"extlinux",
			"liveos-wifi.txt"
		}
	}
	size = 112M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}
	partition loader1 {
		offset = 32K
		size = 4064K
	}
	partition loader2 {
		offset = 8M
		size = 4M
		image = "u-boot-dtb.img"
	}
	partition trust {
		offset = 12M
		size = 4M
	}
	partition boot {
		offset = 16M
		partition-type-uuid = U
		bootable = true
		image = "boot.vfat"
	}
	partition rootfs {
		offset = 128M
		partition-type-uuid = L
		image = "rootfs.ext4"
	}
}
