<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiveOS</title>
<style>
/* 1rem = 16px numa tela de 1280px; tudo escala com a largura da TV */
:root{--bg:#050505;--accent:#0078D7;--bad:#E51400}
*{box-sizing:border-box}
html{font-size:max(10px,1.25vw)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:"Segoe UI","Selawik",Roboto,"Liberation Sans","DejaVu Sans",sans-serif}
button{font-family:inherit}
:focus{outline:none}
::-webkit-scrollbar{display:none}
svg.i{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ===== telas ===== */
.screen{position:absolute;inset:0;overflow:hidden;opacity:0;pointer-events:none;transform:scale(.95);z-index:-1;transition:opacity .5s,transform .5s}
.screen.active{opacity:1;pointer-events:auto;transform:none;z-index:10}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4rem;background:#000}
.loader{display:flex;gap:.5rem;width:19rem;justify-content:center;overflow:hidden}
.dot{width:.65rem;height:.65rem;background:#fff;border-radius:50%;opacity:0;animation:win8move 2.5s infinite cubic-bezier(.1,.8,.9,.1)}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}.dot:nth-child(4){animation-delay:.45s}.dot:nth-child(5){animation-delay:.6s}
@keyframes win8move{0%{transform:translateX(-9rem);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(9rem);opacity:0}}
@keyframes turnstile{0%{opacity:0;transform:perspective(600px) rotateY(-90deg)}100%{opacity:1;transform:perspective(600px) rotateY(0)}}
.turnstile-in{animation:turnstile .35s cubic-bezier(.2,.8,.3,1) forwards}

/* ===== home ===== */
#home-screen{overflow-y:auto}
.header{display:flex;justify-content:space-between;align-items:flex-start;padding:2rem 3.75rem 1rem}
.header h1{margin:0;font-size:2.6rem;font-weight:300}
.header p{margin:0;font-size:1.1rem;color:#bbb;min-height:1.5rem;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.hc{display:flex;align-items:center;gap:.8rem;padding-top:.4rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;border:.15rem solid #fff;background:transparent;color:#fff;padding:.55rem 1.1rem;font-weight:600;font-size:.95rem;cursor:pointer;border-radius:.2rem}
.btn:focus,.btn:hover{background:#fff;color:#000}
.btn.red{border-color:var(--bad);color:var(--bad)}.btn.red:focus,.btn.red:hover{background:var(--bad);color:#fff}
.btn.blue{border-color:var(--accent);background:var(--accent)}.btn.blue:focus,.btn.blue:hover{background:#fff;color:var(--accent)}
#wifi-ind{display:flex;align-items:center;gap:.4rem;font-size:.9rem;color:#777;margin-right:.6rem}
#wifi-ind.on{color:#fff}
#clock{font-size:2rem;font-weight:300;min-width:5.5rem;text-align:right}

.metro{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-flow:dense;gap:.9rem;padding:.6rem 3.75rem 2.5rem;max-width:84rem}
.tile{position:relative;height:7.5rem;cursor:pointer;overflow:hidden;transition:transform .2s}
.tile.wide{grid-column:span 2}
.tile:focus,.tile:hover{transform:scale(1.04);outline:.2rem solid #fff;z-index:5}
.tile-inner{width:100%;height:100%;position:relative;transition:transform .8s;transform-style:preserve-3d}
.tile.flipped .tile-inner{transform:rotateY(180deg)}
.front,.back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:flex-end;padding:.9rem;font-size:1.2rem;font-weight:600}
.back{transform:rotateY(180deg);background:rgba(0,0,0,.8);flex-direction:column;justify-content:center;align-items:flex-start;font-weight:400;font-size:1rem;border-left:.3rem solid #fff;gap:.2rem}
.back small{color:#ccc;font-size:.85rem}
.ico{position:absolute;left:.9rem;top:.8rem;width:2.7rem;height:2.7rem;object-fit:contain}
svg.ico{stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ltr{position:absolute;left:.9rem;top:.55rem;font-size:2.5rem;font-weight:700;line-height:1}

/* ===== telas internas ===== */
#app-screen{background:#111;display:flex;flex-direction:column}
#app-content-area{flex:1;display:flex;flex-direction:column;min-height:0}
.app-wrapper{display:flex;flex-direction:column;height:100%}
.app-top{display:flex;align-items:center;gap:1.2rem;padding:1rem 3rem;background:#1b1b1b;border-bottom:1px solid #333}
.app-top h2{margin:0;font-size:1.8rem;font-weight:300}
.app-body{flex:1;overflow-y:auto;padding:1.6rem 3rem;min-height:0}
.cfg{display:flex;gap:2rem;height:100%}
.cfg-side{width:15rem;flex-shrink:0}
.cfg-item{padding:.9rem 1.2rem;font-size:1.05rem;color:#ccc;border-left:.2rem solid transparent;cursor:pointer}
.cfg-item.on{border-left-color:var(--accent);color:#fff;background:#1b1b1b}
.cfg-item:focus,.cfg-item:hover{background:#fff;color:#000}
.cfg-main{flex:1;overflow-y:auto;padding-right:.5rem}
.cfg-main h3{margin:0 0 1rem;font-size:1.6rem;font-weight:300}
.cfg-main p{color:#bbb;line-height:1.5;margin:.4rem 0}
.row{display:flex;align-items:center;gap:1rem;padding:.9rem 1rem;background:rgba(255,255,255,.07);margin:.4rem 0;cursor:pointer;font-size:1.05rem}
.row:focus,.row:hover{background:#fff;color:#000}
.row b{flex:1;font-weight:500}.row small{opacity:.7}
.pill{display:inline-block;padding:.25rem .8rem;border:.1rem solid #555;border-radius:2rem;margin:.2rem .3rem .2rem 0;font-size:.95rem;cursor:pointer;background:transparent;color:#fff}
.pill.on{background:var(--accent);border-color:var(--accent)}
.pill:focus,.pill:hover{background:#fff;color:#000;border-color:#fff}
.tabs{margin-bottom:1rem}
.store-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.card{display:flex;align-items:center;gap:.9rem;background:#1b1b1b;border:.1rem solid #2a2a2a;padding:.9rem}
.card .swatch{width:3.4rem;height:3.4rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card .swatch img{width:2.2rem;height:2.2rem;object-fit:contain}
.card .info{flex:1;min-width:0}.card .info b{display:block;font-weight:600}.card .info small{color:#888}
.card .btn{padding:.4rem .8rem;font-size:.85rem}
.ok{color:#4CAF50}

/* ===== standby ===== */
.full{position:fixed;inset:0;background:#000;z-index:1000;display:none}
.full.on{display:block;animation:fadeIn .9s ease}
.layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2.4s}
.layer.show{opacity:1}
.layer.kb{animation:kb 60s linear forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1)}}
#sb-shade{position:absolute;inset:0 38% 0 0;background:linear-gradient(to right,rgba(0,0,0,.62),rgba(0,0,0,0))}
#sb-info{position:absolute;left:4rem;top:3.2rem;text-shadow:0 2px 14px rgba(0,0,0,.7)}
#sb-time{font-size:8rem;font-weight:200;line-height:1;letter-spacing:-.1rem}
#sb-date{font-size:1.9rem;margin-top:.6rem;font-weight:300}
#sb-wx{font-size:1.6rem;margin-top:.5rem;font-weight:300;color:#e8f5e0;min-height:2rem}
#sb-txt{font-size:1.4rem;margin-top:1.6rem;max-width:30rem;line-height:1.35;font-weight:300;opacity:.92}
#sb-cred{position:absolute;right:1.5rem;bottom:.9rem;font-size:.8rem;color:rgba(255,255,255,.5)}

/* ===== teclado na tela, instalação, aviso ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:900;display:none;align-items:center;justify-content:center}
.overlay.on{display:flex}
.box{background:#1d6093;border:1px solid rgba(255,255,255,.3);padding:1.6rem 2rem;min-width:36rem}
.box h3{margin:0 0 1rem;font-weight:300;font-size:1.5rem}
#osk-val{background:rgba(255,255,255,.15);border-bottom:.15rem solid #fff;padding:.6rem .8rem;font-size:1.3rem;min-height:2.8rem;margin-bottom:1rem;word-break:break-all}
.krow{display:flex;gap:.3rem;margin-bottom:.3rem;justify-content:center}
.k{min-width:2.9rem;height:2.9rem;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:1.15rem;cursor:pointer}
.k.w{min-width:6.2rem;font-size:.95rem}
.k:focus,.k:hover{background:#fff;color:#1d6093}
#install .box{text-align:center;background:#1b1b1b;min-width:26rem}
.bar{height:.7rem;background:#333;margin-top:1rem}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4CAF50,#0078D7)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:4.4rem;height:4.4rem;animation:spin .9s linear infinite}
#toast{position:fixed;left:50%;bottom:2.2rem;transform:translateX(-50%);background:#0078D7;padding:.8rem 1.6rem;font-size:1.15rem;display:none;z-index:1100;max-width:80%}
</style>
</head>
<body>

<div id="blank-screen" class="screen active center"></div>

<div id="home-screen" class="screen">
  <header class="header">
    <div>
      <h1 id="greeting-title">LiveOS</h1>
      <p id="greeting-sub"></p>
    </div>
    <div class="hc">
      <div id="wifi-ind"><svg class="i" viewBox="0 0 24 24" data-ico="wifi"></svg><span id="wifi-txt">Wi-Fi</span></div>
      <button class="btn" data-nav data-act="standby"><svg class="i" viewBox="0 0 24 24" data-ico="moon"></svg>Standby</button>
      <div id="clock">00:00</div>
    </div>
  </header>
  <div class="metro" id="main-grid"></div>
</div>

<div id="app-screen" class="screen"><div id="app-content-area"></div></div>

<div id="standby-screen" class="full">
  <div class="layer" id="sb-a"></div><div class="layer" id="sb-b"></div>
  <div id="sb-shade"></div>
  <div id="sb-info"><div id="sb-time">--:--</div><div id="sb-date"></div><div id="sb-wx"></div><div id="sb-txt"></div></div>
  <div id="sb-cred">Fotos: Unsplash</div>
</div>

<div id="osk" class="overlay">
  <div class="box">
    <h3 id="osk-title">Digite</h3>
    <div id="osk-val"></div>
    <div id="osk-keys"></div>
  </div>
</div>

<div id="install" class="overlay">
  <div class="box"><h3 id="inst-name">Instalando…</h3><div id="inst-pct">0%</div><div class="bar"><i id="inst-bar"></i></div></div>
</div>

<div id="toast"></div>

/* ---- carregamento de app externo ---- */
var carga=null;
function carregarApp(a,sp){
  if(carga)carga.cancel=true;
  var my={cancel:false,a:a,sp:sp};carga=my;
  sp.style.pointerEvents='auto';sp.style.flexDirection='column';sp.style.gap='1.6rem';sp.style.fontSize='1.3rem';sp.style.fontWeight='300';
  sp.innerHTML='<img class="spin" src="'+SPIN+'" alt=""><div>Abrindo '+esc(a.n)+'…</div>';
  var done=false,ctl=window.AbortController?new AbortController():null,t0=Date.now();
  var tm=setTimeout(function(){if(ctl)try{ctl.abort();}catch(e){}falha();},12000);
  function falha(){
    if(done||my.cancel)return;done=true;clearTimeout(tm);
    sp.innerHTML='<div style="font-size:2.4rem;font-weight:300">Erro de conexão</div>'+
      '<div style="opacity:.9">Verifique a Internet e tente de novo.</div>'+
      '<div style="display:flex;gap:1rem;margin-top:.6rem"><button class="btn" data-nav data-act="appRetry">Tentar de novo</button><button class="btn" data-nav data-act="appVoltar">Voltar</button></div>';
    var b=sp.querySelector('[data-nav]');if(b)b.focus();
  }
  function ok(){
    if(done||my.cancel)return;done=true;clearTimeout(tm);
    setTimeout(function(){if(!my.cancel)location.href=a.u;},Math.max(0,500-(Date.now()-t0)));   // rodinha fica na tela enquanto o navegador troca de página
  }
  var o={mode:'no-cors',cache:'no-store'};if(ctl)o.signal=ctl.signal;
  fetch(a.u,o).then(ok,falha);
}
function appVoltar(){
  if(carga)carga.cancel=true;
  var sp=$('tile-splash');
  if(sp){sp.style.transition='opacity .25s';sp.style.opacity='0';setTimeout(function(){sp.remove();},260);}
  var t=carga&&carga.a?$('tile-'+carga.a.id):null;
  carga=null;
  var p=t||document.querySelector('#main-grid .tile');if(p)p.focus();
}
function appRetry(){if(carga)carregarApp(carga.a,carga.sp);}

    },2500);
  });
}

var WX={0:'Céu limpo',1:'Quase limpo',2:'Parcialmente nublado',3:'Nublado',45:'Neblina',48:'Neblina',51:'Garoa',53:'Garoa',55:'Garoa forte',61:'Chuva fraca',63:'Chuva',65:'Chuva forte',80:'Pancadas de chuva',81:'Pancadas de chuva',82:'Pancadas fortes',95:'Tempestade',96:'Tempestade',99:'Tempestade'};
var loc=null,wxTxt=null,wxAt=0;
function clima(cb){
  if(wxTxt&&Date.now()-wxAt<900000){cb(wxTxt);return;}
  function go(l){
    json('https://api.open-meteo.com/v1/forecast?latitude='+l.lat+'&longitude='+l.lon+'&current_weather=true',function(err,d){
      if(err||!d||!d.current_weather){cb(wxTxt);return;}
      var c=d.current_weather;wxTxt=Math.round(c.temperature)+'°C · '+(WX[c.weathercode]||'')+' · '+l.city;wxAt=Date.now();cb(wxTxt);
    });
  }
  if(loc){go(loc);return;}
  json('https://ipapi.co/json/',function(err,d){loc=(!err&&d&&d.latitude)?{lat:d.latitude,lon:d.longitude,city:d.city||DEF_LOC.city}:DEF_LOC;go(loc);});
}

function Fader(a,b,kb){this.a=a;this.b=b;this.front=null;this.kb=kb;}
Fader.prototype.show=function(url,fb){
  var self=this,next=this.front===this.a?this.b:this.a,prev=this.front;
  function apply(css){
    next.style.backgroundImage=css;next.classList.remove('kb');void next.offsetWidth;
    next.classList.add('show');if(self.kb)next.classList.add('kb');
    if(prev)prev.classList.remove('show');self.front=next;
  }
  if(!url){apply(fb||'none');return;}
  var im=new Image();
  im.onload=function(){apply('url("'+url+'")');};
  im.onerror=function(){if(!self.front)apply(fb||'none');};
  im.src=url;
};
var sbF=new Fader($('sb-a'),$('sb-b'),true),sbT=null;

function sbPasso(){var p=periodo();sbF.show(pick(LAND[p]),FALLBACK[p]);$('sb-txt').textContent=pick(FRASES[p]);}
function abrirStandby(){
  fecharTudo();clearTimeout(tOcioso);
  $('standby-screen').classList.add('on');sbF.front=null;
  $('sb-a').className='layer';$('sb-b').className='layer';
  relogio();$('sb-wx').textContent='';sbPasso();
  clima(function(t){if($('standby-screen').classList.contains('on'))$('sb-wx').textContent=t||'';});
  sbT=setInterval(sbPasso,45000);
}
function fecharTudo(){
  clearInterval(sbT);
  $('standby-screen').classList.remove('on');
}
/* qualquer entrada fecha o Standby; devolve true se consumiu o evento */
function acordar(){
  if($('standby-screen').classList.contains('on')){fecharTudo();resetOcioso();return true;}
  return false;
}

/* inatividade */
var tOcioso=null;
function resetOcioso(){
  clearTimeout(tOcioso);
  var m=store.get('idleMin',10),t=telaAtiva();
  if(!m||!t||(t.id!=='home-screen'&&t.id!=='app-screen'))return;
  tOcioso=setTimeout(abrirStandby,m*60000);
}

/* =====================================================
   AÇÕES (um só ponto para clique, OK do controle e gamepad)
   ===================================================== */
var ACOES={
 abrir:function(a){abrirApp(a);},
 voltar:function(){fecharApp();},appRetry:appRetry,appVoltar:appVoltar,
 standby:abrirStandby,reiniciar:reiniciar,
 lojaTab:function(a){lojaTela(a);var b=document.querySelector('[data-act="lojaTab"][data-arg="'+a+'"]');if(b)b.focus();},
 instalar:instalar,remover:remover,
 cfgSecao:function(a){cfgTela(a);var b=document.querySelector('[data-act="cfgSecao"][data-arg="'+a+'"]');if(b)b.focus();},
 wifiBuscar:wifiBuscar,wifiEscolher:wifiEscolher,
 idleMin:function(a){store.set('idleMin',parseInt(a,10));cfgTela('standby');var b=document.querySelector('[data-act="idleMin"][data-arg="'+a+'"]');if(b)b.focus();},
 restaurar:function(){try{localStorage.clear();}catch(e){}instalados=APPS.filter(function(a){return a.home;}).map(function(a){return a.id;});toast('Apps restaurados ao padrão');},
 oskKey:function(a){oskAdd(a);},
 oskShift:function(){osk.shift=!osk.shift;oskAtualizar();},
 oskDel:function(){if(osk){osk.val=osk.val.slice(0,-1);oskAtualizar();}},
 oskShow:function(){osk.show=!osk.show;oskAtualizar();},
 oskCancel:fecharOSK,
 oskOk:function(){var f=osk&&osk.ok,v=osk&&osk.val;fecharOSK();if(f)f(v);}
};
document.addEventListener('click',function(e){
  if(acordar())return;
  resetOcioso();
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(t&&ACOES[t.getAttribute('data-act')])ACOES[t.getAttribute('data-act')](t.getAttribute('data-arg'));
});

/* ---- navegação espacial por setas ---- */
function escopo(){
  var sp=$('tile-splash');if(sp&&sp.querySelector('[data-nav]'))return sp;
  if($('install').classList.contains('on'))return null;
  if($('osk').classList.contains('on'))return $('osk');
  return telaAtiva();
}
function focaveis(){
  var e=escopo();if(!e)return [];
  return Array.prototype.filter.call(e.querySelectorAll('[data-nav]'),function(x){return x.getClientRects().length>0;});
}
function centro(r){return {x:r.left+r.width/2,y:r.top+r.height/2};}
function mover(dir){
  var els=focaveis();if(!els.length)return;
  var cur=document.activeElement;
  if(!cur||els.indexOf(cur)<0){els[0].focus();return;}
  var c=centro(cur.getBoundingClientRect()),best=null,bd=1e9;
  els.forEach(function(el){
    if(el===cur)return;
    var o=centro(el.getBoundingClientRect()),dx=o.x-c.x,dy=o.y-c.y,ok=false,dist;
    var tol=innerHeight*0.1;
    if(dir==='left')ok=dx<-8&&Math.abs(dy)<Math.abs(dx)*1.2+tol;
    if(dir==='right')ok=dx>8&&Math.abs(dy)<Math.abs(dx)*1.2+tol;
    if(dir==='up')ok=dy<-8&&Math.abs(dx)<Math.abs(dy)*1.2+innerWidth*0.1;
    if(dir==='down')ok=dy>8&&Math.abs(dx)<Math.abs(dy)*1.2+innerWidth*0.1;
    if(!ok)return;
    dist=(dir==='left'||dir==='right')?Math.abs(dx)+Math.abs(dy)*2.5:Math.abs(dy)+Math.abs(dx)*2.5;
    if(dist<bd){bd=dist;best=el;}
  });
  if(best){best.focus();if(best.scrollIntoView)best.scrollIntoView({block:'nearest',inline:'nearest'});}
}
function acao(a){
  if(acordar())return true;
  resetOcioso();
  var t=telaAtiva();
  var spl=$('tile-splash');
  if(spl){
    if(a==='back'||a==='home'){appVoltar();return true;}
    if(!spl.querySelector('[data-nav]'))return true;   // carregando: ignora teclas
  }
  if(a==='up'||a==='down'||a==='left'||a==='right'){oskFis=false;mover(a);return true;}
  if(a==='ok'){
    var f=document.activeElement;
    if(osk&&oskFis){ACOES.oskOk();return true;}
    if(f&&f.click&&f.hasAttribute&&f.hasAttribute('data-nav')){f.click();return true;}
    var els=focaveis();if(els.length)els[0].focus();return true;
  }
  if(a==='back'){
    if(osk){fecharOSK();return true;}
    if(t&&t.id==='app-screen'){fecharApp();return true;}
    return false;
  }
  if(a==='home'){
    if(osk)fecharOSK();
    if(t&&t.id==='app-screen')fecharApp();
    return true;
  }
  return false;
}
var KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'back',BrowserBack:'back',GoBack:'back',Home:'home',BrowserHome:'home'};
document.addEventListener('keydown',function(e){
  if(osk&&!e.ctrlKey&&!e.altKey&&!e.metaKey){
    if(e.key.length===1){oskFis=true;oskAdd(e.key);e.preventDefault();return;}
    if(e.key==='Backspace'){oskFis=true;ACOES.oskDel();e.preventDefault();return;}
  }
  var a=KEYS[e.key]||(e.key==='Backspace'?'back':null);
  if(!a){if(acordar())e.preventDefault();else resetOcioso();return;}
  if(acao(a))e.preventDefault();
},true);
document.addEventListener('mousemove',function(){if(acordar())return;},false);

/* ---- controle de jogo (Gamepad API): direcional, A = OK, B = voltar ---- */
var gpPrev={};
setInterval(function(){
  var pads=navigator.getGamepads?navigator.getGamepads():[],i,p;
  for(i=0;i<pads.length;i++){
    p=pads[i];if(!p)continue;
    var b=function(n){return p.buttons[n]&&p.buttons[n].pressed;};
    var st={up:b(12)||p.axes[1]<-.6,down:b(13)||p.axes[1]>.6,left:b(14)||p.axes[0]<-.6,right:b(15)||p.axes[0]>.6,ok:b(0),back:b(1),home:b(16)};
    for(var k in st){if(st[k]&&!gpPrev[k])acao(k);}
    gpPrev=st;break;
  }
},90);

/* ===== início ===== */
fillIcons();
ligar();
})();
</script>
